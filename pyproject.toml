[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-experiments"
version = "0.1.0"
description = "Effect-grounded fault injection for deterministic guardrails"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["jsonschema>=4", "pytest>=8", "ruff>=0.6"]
analysis = ["scipy>=1.10"]

[project.scripts]
sentinel-experiment = "sentinel_experiments.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*", "sentinel_experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests", "guardian_tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
